services:

  # Docker-in-Docker service.
  # Provides an isolated Docker daemon that Jenkins can use
  # to build and manage application container images.
  docker:
    image: docker:29-dind
    container_name: jenkins-docker
    privileged: true
    restart: unless-stopped

    environment:
      # Enables TLS protection for communication with Docker daemon.
      DOCKER_TLS_CERTDIR: /certs

    volumes:
      # Store TLS certificates used between Jenkins and Docker.
      - jenkins-docker-certs:/certs/client

      # Persist Docker images and build data.
      - jenkins-docker-data:/var/lib/docker

      # Share the Jenkins workspace with the Docker daemon.
      # This allows Node 16 build containers to access source files.
      - jenkins-home:/var/jenkins_home

    networks:
      - jenkins-network


  # Jenkins CI/CD server.
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile

    image: my-jenkins:lts
    container_name: jenkins
    restart: unless-stopped

    depends_on:
      - docker

    # Jenkins web interface is exposed only to the local machine.
    ports:
      - "127.0.0.1:8080:8080"

    environment:
      # Jenkins communicates securely with the DinD daemon using TLS.
      DOCKER_HOST: tcp://docker:2376
      DOCKER_CERT_PATH: /certs/client
      DOCKER_TLS_VERIFY: "1"

    volumes:
      # Persist Jenkins configuration, jobs, plugins,
      # build history and workspaces.
      - jenkins-home:/var/jenkins_home

      # Read-only access to Docker TLS client certificates.
      - jenkins-docker-certs:/certs/client:ro

    networks:
      - jenkins-network


# Named volumes preserve Jenkins and Docker data
# even when containers are restarted.
volumes:
  jenkins-home:
  jenkins-docker-certs:
  jenkins-docker-data:


# Private Docker network used for secure
# Jenkins <-> Docker-in-Docker communication.
networks:
  jenkins-network:
    driver: bridge